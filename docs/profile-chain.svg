<text class="th at" x="130.0" y="75.5" text-anchor="middle">base</text>
<rect class="box" x="236" y="40" width="214" height="63" rx="6" stroke-width="0.6"/>
<text class="mono" x="245" y="75.5" text-anchor="start">rl-0009 · rl-0010 · rl-0011 · rl-0012</text>
