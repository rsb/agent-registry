<rect class="box" x="466" y="269" width="254" height="63" rx="6" stroke-width="0.6"/>
<text class="mono" x="475" y="289.5" text-anchor="start">.github/workflows/pr.yml, deploy.yml</text>
<text class="mono" x="475" y="304.5" text-anchor="start">tools/ci/*.mjs</text>
<text class="tx" x="475" y="319.5" text-anchor="start">product/, decisions/ CLAUDE.md (pointers)</text>
<path class="e" d="M380 338 L380 374" marker-end="url(#m)"/>
<rect class="bg" x="383.0" y="349" width="235.7" height="15" rx="3"/>
<text class="lbl" x="388" y="360" text-anchor="start">Gauge overlays all four, then renders</text>
<rect class="p" x="40" y="376" width="680" height="56" rx="8" stroke-width="0.8"/>
<text class="th pt" x="380.0" y="400.0" text-anchor="middle">the daybook repository</text>
<text class="tx pt" x="380.0" y="416.0" text-anchor="middle">every layer&#x27;s files + tools/rules/rules.json + the rsb:rules region of AGENTS.md</text>
<text class="th" x="40" y="466" text-anchor="start">How each file class is checked</text>
