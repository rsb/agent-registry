<text class="lbl" x="40" y="30" text-anchor="start">profiles/&lt;layer&gt;/profile.toml</text>
<text class="lbl" x="250" y="30" text-anchor="start">selects</text>
<text class="lbl" x="470" y="30" text-anchor="start">manages (files/)</text>
