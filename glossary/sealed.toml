[term]
id = "sealed"
intent = "An outbox whose manifest, written last, is present and lists every entry file with a matching hash; anything else is no outbox."
kind = "concept"
status = "active"
see_also = ["recorded", "effect", "attempt-cause"]
definition = """
Sealing is how the custodian knows the agent finished writing. An
attempt that exits without a sealed outbox failed with cause
`no_outbox`; it is never a rejection, because it is far more often an
attempt killed mid-write than a misbehaving agent. Sealed is a state
on disk only; once the custodian records the outbox, recorded holds.

Source: decisions/2026-10-27-effects-and-unfinished-work.md, section 4; `schemas/outbox/v1/README.md`.
"""
