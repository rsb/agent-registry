[term]
id = "attempt-cause"
aliases = ["failure cause"]
intent = "Why an attempt ended without a hand-back the loop can use, from the closed set `exited_nonzero`, `timed_out`, `no_outbox`, `intent_lost`, `work_lost`, `stopped`."
kind = "concept"
status = "active"
see_also = ["sealed"]
definition = """
Recorded per attempt. Every cause but `stopped` counts against the
attempt budget, and each has its resume brief. `intent_lost` means the
workspace was lost after the push, so only the hand-back must be
produced again; `work_lost` means it was lost before the push, so the
work continues from the previous head. `stopped` is the owner's act.

Source: decisions/2026-10-27-effects-and-unfinished-work.md, section 8.
"""
