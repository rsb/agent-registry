[term]
id = "unverified"
intent = "An effect whose write was attempted, whose acknowledgement was lost, and whose kind has no lookup; the loop parks `effect_unverified`."
kind = "concept"
status = "active"
see_also = ["effect", "performed", "effect-unverified"]
definition = """
Only a kind with no lookup can enter it, such as email later; no M1
kind can. The kind's replay policy (`resend`, `inspect`, `never`)
decides what follows, and it is never sent twice by accident.
Terminal.

Source: decisions/2026-10-27-effects-and-unfinished-work.md, sections 3 and 7.
"""
