[term]
id = "probe-ticket"
aliases = ["probe"]
intent = "A ticket on a reference app whose purpose is to drive the loop into a named state, with the expected end state written before the run."
kind = "concept"
status = "active"
see_also = ["refused", "superseded"]
definition = """
A probe is the live confirmation of what the fake-world harness covers
mechanically. Its spec names any owner act and timing it needs (to get
a refusal, close the issue between sealing and consumption) and the
expected state of each effect. Probe loops are excluded from the
per-agent and per-system statistics. Its format is open.

Source: decisions/2026-10-27-effects-and-unfinished-work.md, section 11.
"""
