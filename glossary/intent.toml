[term]
id = "intent"
intent = "An effect the custodian has recorded but the world does not yet carry; the store is authoritative for it."
kind = "concept"
status = "active"
see_also = ["effect", "recorded", "performed"]
definition = """
What the agent asked for, once the custodian has recorded it. Recording
turns every entry of a valid outbox into an effect in state `pending`:
intent, not yet in the world or not yet confirmed there. The store is
authoritative for intent and for what the custodian has recorded doing;
the world is authoritative for whether a keyed effect exists.

Source: decisions/2026-10-27-effects-and-unfinished-work.md, sections 2 and 3.
"""
